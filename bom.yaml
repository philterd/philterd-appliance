# Philterd Appliance bill of materials. The single source of truth for what
# the appliance ships.
#
#   registry   published, pulled as-is
#   build      not published yet, so it is built and tagged with the name it
#              will carry once it is
#
# Nothing outside this file knows which tier a component is in. Promoting one
# means setting `source: registry` and dropping the build keys.
#
# Verified against Docker Hub on 2026-08-07.

apiVersion: philterd-appliance/v1
release: "0.1.0"

defaults:
  # Sibling checkouts are preferred over remote git contexts when present.
  # This path is relative to the repository root.
  sourceRoot: ".."

components:

  # ---------------------------------------------------------------- console --

  - name: console
    image: philterd/philterd-appliance-console
    version: "0.1.0"
    source: build
    context: console
    profile: core
    description: >
      Single pane of glass for the appliance. Built from this repository
      rather than a sibling checkout.

  # ---------------------------------------------------------- core redaction --

  - name: philter
    image: philterd/philter
    version: "4.0.0-SNAPSHOT"
    source: build
    dir: philter
    repo: https://github.com/philterd/philter.git
    ref: main
    profile: core
    description: >
      Turnkey PII/PHI redaction API. The flagship.

      The appliance targets Philter 4.0, which serves its own Vaadin dashboard
      from the same port as the API and so replaces the old separate
      philter-ui container. 4.0 is unreleased: Docker Hub's newest tag is
      3.4.1 and the newest git tag is 3.4.0, so the flagship is built from
      source until 4.0.0 ships. Promote to `source: registry` at that point.

  - name: ph-eye
    image: philterd/ph-eye
    # Model variant is part of the tag. Swap for pii_en_medium or pii_en_large
    # on hardware that can carry it, or append -gpu when a GPU is present.
    version: "1.3.0-pii_en_small"
    source: registry
    profile: core
    description: Hosts the AI/NLP models that detect PII/PHI.

  # ------------------------------------------------------------ policy tools --

  - name: policy-editor
    image: philterd/philterd-redaction-policy-editor
    version: "1.0.0"
    source: registry
    profile: core
    description: No-code editor for building Philter redaction policies.

  - name: philterscope
    image: philterd/philterscope
    version: "0.1.0"
    source: build
    dir: philterscope
    repo: https://github.com/philterd/philterscope.git
    ref: main
    profile: core
    description: >
      Scores redaction output against a golden dataset and hosts the
      evaluation UI. The image carries both binaries: philterscope-serve for
      the UI and philterscope-audit for a one-shot audit run.

      The Dockerfile it builds from is new and not yet merged upstream.

  # ------------------------------------------------------------ dependencies --

  - name: mongodb
    image: mongo
    version: "8.2.12"
    source: registry
    profile: core
    description: Backing store for Philter.

  # --------------------------------------------------------------- build tier --
  #
  # Each of these has a working Dockerfile but no published image. They are
  # built locally and tagged with the name they will carry once their
  # repository gains publishing CI. See docs/publishing.md.

  - name: arbiter
    image: philterd/arbiter
    version: "0.1.0"
    source: build
    dir: arbiter
    repo: https://github.com/philterd/arbiter.git
    ref: main
    profile: full
    description: >
      Human-in-the-loop review surface. Pulls in a large backing stack of its
      own (Valkey, OpenSearch, Elasticsearch, MinIO, Postgres), which is why it
      sits in the full profile rather than core.

  - name: phinder
    image: philterd/phinder
    version: "0.1.0"
    source: build
    dir: phinder
    repo: https://github.com/philterd/phinder.git
    ref: main
    profile: full
    description: High-speed scanner that maps where sensitive data lives.

  - name: philter-ai-proxy
    image: philterd/philter-ai-proxy
    version: "0.1.0"
    source: build
    dir: philter-ai-proxy
    repo: https://github.com/philterd/philter-ai-proxy.git
    ref: main
    profile: full
    description: >
      Redacting proxy for LLM providers. A Docker Hub repository exists but
      carries no tags, so this is still built locally.

  - name: philter-mcp
    image: philterd/philter-mcp
    version: "0.1.0"
    source: build
    dir: philter-mcp
    repo: https://github.com/philterd/philter-mcp.git
    ref: main
    profile: full
    description: >
      MCP server exposing redaction as tools. Its repository already has a
      Docker workflow that tags this exact name but does not publish, so this
      is the component closest to promotion.

# Products deliberately absent from the appliance for now:
#
#   phisql                 No Dockerfile in the repository, so there is
#                          nothing to containerize yet.
#   phield                 Not checked out locally and not yet assessed.
#   philterdiffuse         Has a Dockerfile, but no appliance use case defined.
#   philolog               Has a Dockerfile, but no appliance use case defined.
