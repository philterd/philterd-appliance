# Philterd Appliance.
#
# IMG_* variables come from bom.yaml via `make images`.
# Services without a `profiles` key are the core profile and always start.
# Only the proxy binds host ports.

name: philterd-appliance

services:

  # One listener per product, because Vaadin and Spring UIs assume they own the
  # root of their origin.
  proxy:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${APPLIANCE_PORT:-8443}:8443"
      - "${PHILTER_PORT:-8444}:8444"
      - "${POLICY_EDITOR_PORT:-8445}:8445"
      - "${ARBITER_PORT:-8446}:8446"
      - "${PHILTERSCOPE_PORT:-8447}:8447"
    volumes:
      - ./proxy/appliance.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy/proxy-common.conf:/etc/nginx/appliance/proxy-common.conf:ro
      # Swapping certificates changes the mount source, not the nginx config.
      - ${APPLIANCE_TLS_CERT:-./proxy/tls/appliance.crt}:/etc/nginx/tls/appliance.crt:ro
      - ${APPLIANCE_TLS_KEY:-./proxy/tls/appliance.key}:/etc/nginx/tls/appliance.key:ro
    depends_on:
      console:
        condition: service_started
    networks: [appliance]

  console:
    image: ${IMG_CONSOLE}
    restart: unless-stopped
    environment:
      # Substituted into the console's links at container start.
      PHILTER_PORT: "${PHILTER_PORT:-8444}"
      POLICY_EDITOR_PORT: "${POLICY_EDITOR_PORT:-8445}"
      ARBITER_PORT: "${ARBITER_PORT:-8446}"
      PHILTERSCOPE_PORT: "${PHILTERSCOPE_PORT:-8447}"
    networks: [appliance]

  philter:
    image: ${IMG_PHILTER}
    restart: unless-stopped
    environment:
      # The proxy terminates TLS. The published image defaults this to true.
      SSL_ENABLED: "false"
      MONGODB_CONNECTION_STRING: mongodb://mongodb:27017/philter
      PHILTER_ENCRYPTION_KEY: ${PHILTER_ENCRYPTION_KEY:?run 'make bootstrap' first}
      # Seeded on first start, only when the admin user has no keys.
      PHILTER_BOOTSTRAP_API_KEY: ${PHILTER_BOOTSTRAP_API_KEY:-}
      ADMIN_CROSS_USER_ACCESS_ENABLED: "true"
    depends_on:
      mongodb:
        condition: service_healthy
      ph-eye:
        condition: service_started
    networks: [appliance]

  # Philter resolves its model endpoint by this hostname. Renaming needs a
  # matching Philter config change.
  ph-eye:
    image: ${IMG_PH_EYE}
    restart: unless-stopped
    networks: [appliance]

  mongodb:
    image: ${IMG_MONGODB}
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: philter
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [appliance]

  policy-editor:
    image: ${IMG_POLICY_EDITOR}
    restart: unless-stopped
    environment:
      HIDE_PII_WARNING: "0"
    networks: [appliance]

  # Serves audits from MongoDB. Privacy mode obfuscates PII in the UI and is on
  # by default here, since an appliance holds real data.
  philterscope:
    image: ${IMG_PHILTERSCOPE}
    restart: unless-stopped
    command: ["philterscope-serve", "--port", "5000", "--privacy=${PHILTERSCOPE_PRIVACY:-true}"]
    environment:
      PHILTERSCOPE_MONGODB_CONNECTION_STRING: mongodb://mongodb:27017/philterscope
      # Only reachable under the full profile, where Ollama runs.
      PHILTERSCOPE_OLLAMA_URL: http://ollama:11434
      PHILTERSCOPE_OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
    depends_on:
      mongodb:
        condition: service_healthy
    networks: [appliance]

  # One-shot. Not started by `up`; run it with:
  #   docker compose run --rm philterscope-audit --golden /data/golden --input /data/raw --output /data
  philterscope-audit:
    image: ${IMG_PHILTERSCOPE}
    profiles: [tools]
    # Defaults point at the appliance's own Philter. A flag passed on the
    # command line appears later and wins, so both stay overridable.
    entrypoint:
      - philterscope-audit
      - --url
      - http://philter:8080
      - --token
      - ${PHILTER_BOOTSTRAP_API_KEY:-}
    # Reports are written into a host directory, so the container has to run as
    # the user that owns it rather than as the image's own account.
    user: "${APPLIANCE_UID:-1000}:${APPLIANCE_GID:-1000}"
    environment:
      PHILTERSCOPE_MONGODB_CONNECTION_STRING: mongodb://mongodb:27017/philterscope
      PHILTERSCOPE_OLLAMA_URL: http://ollama:11434
      PHILTERSCOPE_OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
    volumes:
      - ${PHILTERSCOPE_DATA:-./data/philterscope}:/data
    depends_on:
      mongodb:
        condition: service_healthy
    networks: [appliance]

  # Arbiter needs only MongoDB and OpenSearch in production. The MinIO,
  # Postgres and Elasticsearch in its own compose back demo data sources.
  arbiter:
    image: ${IMG_ARBITER}
    profiles: [full]
    restart: unless-stopped
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/arbiter
      ARBITER_CRYPTO_SECRET: ${ARBITER_CRYPTO_SECRET:?run 'make bootstrap' first}
      ARBITER_ADMIN_INITIAL_PASSWORD: ${ARBITER_ADMIN_INITIAL_PASSWORD:?run 'make bootstrap' first}
      ARBITER_DEMO_DATA_ENABLED: "false"
      # Arbiter refuses private-range data-source hosts as an SSRF guard, and
      # every appliance service resolves to one. Named explicitly here.
      # Relaxed binding for arbiter.data-sources.allowed-hosts.
      ARBITER_DATASOURCES_ALLOWEDHOSTS: ollama,philter,opensearch
    depends_on:
      mongodb:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks: [appliance]

  # Local LLM, shared by Philter Scope's --ai suggestions and Arbiter's
  # LLM-as-a-Judge. Nothing leaves the box, so prompts are not proxied.
  ollama:
    image: ollama/ollama:0.32.6
    profiles: [full]
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [appliance]

  # Ollama starts with no models. Pulls the configured one, then exits.
  ollama-init:
    image: ollama/ollama:0.32.6
    profiles: [full]
    entrypoint: ["/bin/sh", "-c"]
    command: ['ollama pull "$${OLLAMA_MODEL}"']
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
    depends_on:
      ollama:
        condition: service_healthy
    networks: [appliance]

  opensearch:
    image: opensearchproject/opensearch:3.6.0
    profiles: [full]
    restart: unless-stopped
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [appliance]

networks:
  appliance:

volumes:
  mongo-data:
  opensearch-data:
  ollama-models:
