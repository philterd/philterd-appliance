# Shared reverse-proxy settings, included from each location block.
#
# Kept outside conf.d deliberately: every *.conf in conf.d is pulled into the
# http context automatically, which would apply these at the wrong level.

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# Spring and Vaadin build absolute URLs from this. Without it they emit http://
# links behind the appliance's TLS termination and the dashboard breaks.
proxy_set_header X-Forwarded-Proto $scheme;

# Websocket upgrade for Vaadin and Spring server push.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Redaction of a large document can take a while, and Vaadin holds a long-lived
# push connection open. The 60s default would sever both.
proxy_connect_timeout 10s;
proxy_send_timeout    300s;
proxy_read_timeout    300s;

# Streaming responses and push connections must not be held in a buffer.
proxy_buffering off;
