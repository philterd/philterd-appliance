# Appliance front door. Mounted at /etc/nginx/conf.d/default.conf.
#
# One listener per product rather than path prefixes, because Vaadin and Spring
# UIs assume they own the root of their origin.

# Docker DNS. Needed because upstreams are addressed through variables below.
resolver 127.0.0.11 valid=10s ipv6=off;

# Websocket upgrade for Vaadin and Spring server push.
map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

# Inherited by every server block. bin/appliance-bootstrap generates this pair.
ssl_certificate     /etc/nginx/tls/appliance.crt;
ssl_certificate_key /etc/nginx/tls/appliance.key;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:appliance:10m;
ssl_session_timeout 1h;

add_header X-Content-Type-Options nosniff    always;
add_header X-Frame-Options        SAMEORIGIN always;
add_header Referrer-Policy        no-referrer always;

server_tokens off;

gzip         on;
gzip_vary    on;
gzip_proxied any;
gzip_types   text/plain text/css application/javascript application/json image/svg+xml;

# The 1m default would reject realistic redaction payloads.
client_max_body_size 64m;

# Console.
server {
	listen 8443 ssl;
	http2 on;

	location / {
		# Upstream in a variable, so DNS resolves per request. Without this
		# nginx refuses to start when a service is absent.
		set $upstream_console http://console:80;
		proxy_pass $upstream_console;
		include /etc/nginx/appliance/proxy-common.conf;
	}
}

# Philter 4.0 serves its API and Vaadin dashboard from this one port.
server {
	listen 8444 ssl;
	http2 on;

	location / {
		set $upstream_philter http://philter:8080;
		proxy_pass $upstream_philter;
		include /etc/nginx/appliance/proxy-common.conf;
	}
}

# Redaction policy editor.
server {
	listen 8445 ssl;
	http2 on;

	location / {
		set $upstream_policy_editor http://policy-editor:8080;
		proxy_pass $upstream_policy_editor;
		include /etc/nginx/appliance/proxy-common.conf;
	}
}

# Arbiter. 502 unless the full profile is up.
server {
	listen 8446 ssl;
	http2 on;

	location / {
		set $upstream_arbiter http://arbiter:8080;
		proxy_pass $upstream_arbiter;
		include /etc/nginx/appliance/proxy-common.conf;
	}
}

# Philter Scope evaluation UI.
server {
	listen 8447 ssl;
	http2 on;

	location / {
		set $upstream_philterscope http://philterscope:5000;
		proxy_pass $upstream_philterscope;
		include /etc/nginx/appliance/proxy-common.conf;
	}
}
