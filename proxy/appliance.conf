# Philterd Appliance front door.
#
# Mounted at /etc/nginx/conf.d/default.conf, so everything here sits in nginx's
# http context and the stock nginx.conf around it is left alone.
#
# One listener per product rather than path prefixes: Philter's Vaadin
# dashboard and Arbiter's Spring UI both assume they own the root of their
# origin. Distinct ports also resolve the collision where Philter, Arbiter and
# the policy editor all listen on 8080 inside their own containers.

# Docker's embedded DNS. Needed because the upstreams below are addressed
# through variables (see the comment on proxy_pass) and so are resolved at
# request time rather than at startup.
resolver 127.0.0.11 valid=10s ipv6=off;

# Vaadin and Spring both use websockets for server push. This maps a client's
# Upgrade header onto the Connection header nginx sends upstream, closing the
# connection cleanly when the client is not upgrading.
map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

# TLS is configured once here and inherited by every server block below.
# bin/appliance-bootstrap generates this certificate. To use your own, drop the
# pair in proxy/tls/ under the same two names and restart the proxy.
ssl_certificate     /etc/nginx/tls/appliance.crt;
ssl_certificate_key /etc/nginx/tls/appliance.key;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:appliance:10m;
ssl_session_timeout 1h;

add_header X-Content-Type-Options nosniff    always;
add_header X-Frame-Options        SAMEORIGIN always;
add_header Referrer-Policy        no-referrer always;

server_tokens off;

gzip             on;
gzip_vary        on;
gzip_proxied     any;
gzip_types       text/plain text/css application/javascript application/json image/svg+xml;

# Redaction payloads can be large, and the default 1m limit would reject them.
client_max_body_size 64m;

# --------------------------------------------------------------- console --

server {
	listen 8443 ssl;
	http2 on;

	location / {
		# Assigning the upstream to a variable defers DNS resolution to request
		# time. Without it nginx resolves every upstream at startup and refuses
		# to start when one is missing, which would make the core profile fail
		# purely because Arbiter is not running. With it, an absent service
		# returns 502 on request instead, which is the signal we want.
		set $upstream_console http://console:80;
		proxy_pass $upstream_console;
		include /etc/nginx/appliance/proxy-common.conf;
	}
}

# --------------------------------------------------------------- philter --
#
# Philter 4.0 serves its REST API and its Vaadin dashboard from this one port.

server {
	listen 8444 ssl;
	http2 on;

	location / {
		set $upstream_philter http://philter:8080;
		proxy_pass $upstream_philter;
		include /etc/nginx/appliance/proxy-common.conf;
	}
}

# --------------------------------------------------------- policy editor --

server {
	listen 8445 ssl;
	http2 on;

	location / {
		set $upstream_policy_editor http://policy-editor:8080;
		proxy_pass $upstream_policy_editor;
		include /etc/nginx/appliance/proxy-common.conf;
	}
}

# --------------------------------------------------------------- arbiter --
#
# Only reachable when the full profile is running. Returns 502 otherwise, which
# is the intended signal that the profile is not up.

server {
	listen 8446 ssl;
	http2 on;

	location / {
		set $upstream_arbiter http://arbiter:8080;
		proxy_pass $upstream_arbiter;
		include /etc/nginx/appliance/proxy-common.conf;
	}
}
