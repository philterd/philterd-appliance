# Shared settings for the health probes.
#
# Timeouts are deliberately short: a hung product should show as unavailable
# quickly rather than stall the console. Upstream status codes are passed
# through untouched so the page can tell "responded" from "unreachable".

proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_connect_timeout 2s;
proxy_send_timeout    3s;
proxy_read_timeout    3s;

proxy_intercept_errors off;

add_header Cache-Control "no-store" always;
