# Shared by the health probes. Short timeouts so a hung product shows as
# unavailable rather than stalling the console.

proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_connect_timeout 2s;
proxy_send_timeout    3s;
proxy_read_timeout    3s;

# Pass upstream status through, so the page can tell responded from unreachable.
proxy_intercept_errors off;

add_header Cache-Control "no-store" always;
