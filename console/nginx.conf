# Console. Plain HTTP internally; the appliance proxy terminates TLS.
#
# The browser cannot reach the internal network, so the console proxies one
# probe per product and the page polls them same-origin.

# Resolve per request, so an absent product does not stop nginx from starting.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
	listen 80;

	root  /usr/share/nginx/html;
	index index.html;

	location / {
		try_files $uri $uri/ =404;
	}

	# Real health check. Unauthenticated in Philter 4.0.
	location = /probe/philter {
		set $probe_philter http://philter:8080/actuator/health;
		proxy_pass $probe_philter;
		include /etc/nginx/appliance/probe.conf;
	}

	# Returns a fixed string, so this proves the process is serving and no more.
	location = /probe/ph-eye {
		set $probe_pheye http://ph-eye:5000/status;
		proxy_pass $probe_pheye;
		include /etc/nginx/appliance/probe.conf;
	}

	# No health endpoint in these three, so the root path is the only signal.
	location = /probe/policy-editor {
		set $probe_policy_editor http://policy-editor:8080/;
		proxy_pass $probe_policy_editor;
		include /etc/nginx/appliance/probe.conf;
	}

	location = /probe/arbiter {
		set $probe_arbiter http://arbiter:8080/;
		proxy_pass $probe_arbiter;
		include /etc/nginx/appliance/probe.conf;
	}

	location = /probe/philterscope {
		set $probe_philterscope http://philterscope:5000/;
		proxy_pass $probe_philterscope;
		include /etc/nginx/appliance/probe.conf;
	}
}
