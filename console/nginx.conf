# The console is served plain HTTP on the internal network. The appliance
# proxy terminates TLS in front of it.
#
# The /probe/ endpoints exist because the browser cannot reach the internal
# network directly. The console can, so it proxies one probe per product and
# the page polls them same-origin, which avoids both CORS and certificate
# prompts against each product's port.

# Resolve upstreams per request, so a product that is not running (Arbiter
# outside the full profile) does not stop nginx from starting.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
	listen 80;

	root  /usr/share/nginx/html;
	index index.html;

	location / {
		try_files $uri $uri/ =404;
	}

	# Spring Boot Actuator, exposed and permitted without auth in Philter 4.0.
	location = /probe/philter {
		set $probe_philter http://philter:8080/actuator/health;
		proxy_pass $probe_philter;
		include /etc/nginx/appliance/probe.conf;
	}

	# PhEye's own endpoint. Returns a fixed string, so it proves the process is
	# serving and nothing more.
	location = /probe/ph-eye {
		set $probe_pheye http://ph-eye:5000/status;
		proxy_pass $probe_pheye;
		include /etc/nginx/appliance/probe.conf;
	}

	# No actuator in either of these, so the root path is the only signal
	# available. Any HTTP response means the app is serving.
	location = /probe/policy-editor {
		set $probe_policy_editor http://policy-editor:8080/;
		proxy_pass $probe_policy_editor;
		include /etc/nginx/appliance/probe.conf;
	}

	location = /probe/arbiter {
		set $probe_arbiter http://arbiter:8080/;
		proxy_pass $probe_arbiter;
		include /etc/nginx/appliance/probe.conf;
	}
}
